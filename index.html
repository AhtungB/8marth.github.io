<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🌸 Поздравление с 8 марта!</title>
    <style>
        body {
            font-family: 'Arial Rounded MT Bold', cursive;
            background: #fff0f5;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .section {
            display: none;
            max-width: 600px;
            margin: 20px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.2);
            animation: sectionAppear 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes sectionAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .active {
            display: block;
        }

        h1 {
            color: #ff69b4;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.3);
            font-size: 2.5em;
            letter-spacing: 1px;
        }

        .flower-option {
            display: inline-block;
            margin: 10px;
            padding: 15px;
            border: 2px solid #ffb6c1;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .flower-option:hover {
            transform: scale(1.05);
            background: #fff5f9;
        }

        .flower-option.selected {
            border-color: #ff69b4;
            background: #fff0f5;
        }

        .flower-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
        }

        button {
            background: linear-gradient(145deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
            position: relative;
            overflow: hidden;
        }

        button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent, 
                rgba(255,255,255,0.3), 
                transparent);
            transform: rotate(45deg);
            animation: buttonShine 3s infinite;
        }

        @keyframes buttonShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        button:hover {
            transform: scale(1.05);
        }

        input {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ffb6c1;
            border-radius: 10px;
            margin: 10px;
            transition: all 0.3s ease;
            width: 250px;
        }

        input:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.2);
            transform: scale(1.05);
        }

        #bouquet {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 250px;
            margin: 50px 0;
            position: relative;
            background: linear-gradient(45deg, #fff0f5 30%, #ffe6ee 100%);
            border-radius: 30px;
            padding: 20px;
            max-width: 90%;
        }

        .flower-container {
            position: relative;
            height: 200px;
            width: 120px;
            transform-origin: bottom center;
            animation: float 3s ease-in-out infinite;
            z-index: 2;
            perspective: 1000px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(var(--angle)); }
            50% { transform: translateY(-20px) rotate(var(--angle)); }
        }

        .stem {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 5px;
            height: 180px;
            background: linear-gradient(to right, #3d8b2d, #55a341);
            transform: translateX(-50%);
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1;
        }

        .stem::before,
        .stem::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 35px;
            background: linear-gradient(135deg, #67b955 20%, #4d993d 80%);
            border-radius: 50% 0 50% 50%;
            transform-origin: bottom center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            clip-path: polygon(0 20%, 100% 0, 100% 80%, 20% 100%);
            animation: leaf-float 4s ease-in-out infinite;
            z-index: 0;
        }

        /* Поднятые листья */
        .stem::before {
            left: -12px;
            top: 20%;  /* Было 30% */
            transform: rotate(-35deg) skew(-5deg);
            border-top: 2px solid #8dce7f;
            border-left: 2px solid #8dce7f;
        }

        .stem::after {
            right: -12px;
            top: 40%;  /* Было 50% */
            transform: rotate(45deg) skew(5deg);
            border-top: 2px solid #8dce7f;
            border-right: 2px solid #8dce7f;
        }

        @keyframes leaf-float {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.05); }
        }

        .final-bouquet-img {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 15px;
            z-index: 1;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.1));
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .final-bouquet-img:hover {
            transform: translateX(-50%) scale(1.1) rotate(-5deg);
            z-index: 4;
        }

        .flower-container:nth-child(1) {
            --angle: -25deg;
            margin-right: -140px;
        }
        .flower-container:nth-child(2) {
            --angle: 0deg;
            z-index: 3;
        }
        .flower-container:nth-child(3) {
            --angle: 25deg;
            margin-left: -140px;
        }

        .congrats-text {
            font-size: 20px;
            line-height: 1.6;
            color: #333;
            margin: 30px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .bow {
            position: absolute;

            transform: translateX(-50%);
            bottom: 19px;
            width: 45px;
            height: 45px;
            z-index: 2;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1));
        }

        .decorative-hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            opacity: 0;
            animation: heartFloat 6s linear infinite;
            font-size: 24px;
        }

        @keyframes heartFloat {
            0% {
                opacity: 0;
                transform: translateY(100vh) rotate(0deg);
            }
            20% {
                opacity: 0.7;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) rotate(720deg);
            }
        }
    </style>
</head>

        let userName = '';
        let selectedFlowers = [];

        function saveName() {
            const nameInput = document.getElementById('userName');
            if (!nameInput.value.trim()) {
                alert('Пожалуйста, введите ваше имя 🌸');
                return;
            }
            userName = nameInput.value;
            showSection('flower-section');
        }

        function selectFlower(flowerName, element) {
            element.classList.toggle('selected');
            
            if (selectedFlowers.includes(flowerName)) {
                selectedFlowers = selectedFlowers.filter(f => f !== flowerName);
            } else {
                if (selectedFlowers.length < 3) {
                    selectedFlowers.push(flowerName);
                } else {
                    element.classList.remove('selected');
                    alert('Можно выбрать только 3 цветка 😊');
                }
            }
        }

        function createBouquet() {
            if (selectedFlowers.length !== 3) {
                alert('Пожалуйста, выберите ровно 3 цветка для букета 🌸');
                return;
            }

            document.getElementById('finalName').textContent = userName;
            const bouquetContainer = document.getElementById('bouquet');
            bouquetContainer.innerHTML = selectedFlowers
                .map((flower, index) => `
                    <div class="flower-container">
                        <div class="stem">
                            ${index === 1 ? '<img src="https://emojicdn.elk.sh/🎀" class="bow">' : ''}
                        </div>
                        <img src="${getFlowerImage(flower)}" 
                             class="final-bouquet-img"
                             title="${flower}">
                    </div>`)
                .join('');

            showSection('result-section');
        }

        function getFlowerImage(flower) {
            const images = {
                'розы': 'https://emojicdn.elk.sh/🌹',
                'тюльпаны': 'https://emojicdn.elk.sh/🌷',
                'лилии': 'https://emojicdn.elk.sh/🌸',
                'орхидеи': 'image.jpg',
                'пионы': 'https://emojicdn.elk.sh/🌺'
            };
            return images[flower];
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const section = document.getElementById(sectionId);
            section.classList.add('active');
            
            if(sectionId === 'result-section') {
                const congratsElement = section.querySelector('.congrats-text');
                congratsElement.innerHTML = congratVariants[Math.floor(Math.random() * congratVariants.length)];
            }
        }

        function createHearts() {
            const heartsContainer = document.querySelector('.decorative-hearts');
            const emojis = ['🌸', '🌺', '🌼', '💮', '🌹'];
            
            for(let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heartsContainer.appendChild(heart);
            }
        }

        createHearts();
    </script>
